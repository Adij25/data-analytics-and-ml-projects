name: ci
on: [push, pull_request]
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r requirements.txt
      - run: pytest -q
      - name: Train quick model so the image has an artifact
        run: python -m src.train --quick
      - name: Build Docker image
        run: docker build -t churn-api .
      - name: Smoke-test container
        run: |
          docker run -d -p 8000:8000 --name churn churn-api
          for i in $(seq 1 20); do curl -sf localhost:8000/health && break || sleep 2; done
          curl -sf localhost:8000/health
